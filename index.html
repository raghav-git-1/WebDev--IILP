<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simple Shop — Frontend</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="logo">Simple Shop</h1>
      <div class="controls">
        <input id="search" placeholder="Search products..." aria-label="Search products">
        <select id="sort" aria-label="Sort products">
          <option value="default">Sort</option>
          <option value="price-asc">Price: Low → High</option>
          <option value="price-desc">Price: High → Low</option>
        </select>
        <button id="cart-toggle" aria-expanded="false">Cart (<span id="cart-count">0</span>)</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="products" class="product-grid" aria-live="polite"></section>
  </main>

  <aside id="cart" class="cart">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button id="close-cart">✕</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-footer">
      <div class="total">Total: $<span id="cart-total">0.00</span></div>
      <button id="checkout">Checkout</button>
    </div>
  </aside>

  <div id="overlay" class="overlay" hidden></div>

  <template id="product-template">
    <article class="product">
      <img class="product-image" alt="">
      <div class="product-body">
        <h3 class="product-title"></h3>
        <p class="product-price"></p>
        <div class="product-actions">
          <button class="btn btn-add">Add to cart</button>
          <button class="btn btn-details">Details</button>
        </div>
      </div>
    </article>
  </template>

  <div id="modal" class="modal" hidden>
    <div class="modal-content">
      <button id="modal-close" class="modal-close">✕</button>
      <img id="modal-image" alt="" class="modal-image">
      <h2 id="modal-title"></h2>
      <p id="modal-price"></p>
      <p id="modal-description"></p>
      <button id="modal-add" class="btn">Add to cart</button>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
